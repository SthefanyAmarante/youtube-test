<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player YouTube</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="player"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let ytPlayer;
    let ready = false;

    function onYouTubeIframeAPIReady() {
      const params = new URLSearchParams(location.search);
      const videoId = params.get('id') || 'jNQXAC9IVRw';

      ytPlayer = new YT.Player('player', {
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          mute: 1,
          controls: 0,           // controles nativos permanecem
          modestbranding: 1,     // reduz logo
          rel: 0,
          showinfo: 0,           // esconde título e informações
          iv_load_policy: 3,     // esconde anotações
          cc_load_policy: 0,     // não força legendas
          fs: 1,                 // tela cheia
          disablekb: 1,          // desativa atalhos de teclado do YouTube
          enablejsapi: 1,
          origin: 'https://www.youtube.com'
        },
        events: {
          onReady: () => {
            ready = true;
            console.log('[player.html] Player pronto');
            try {
              window.parent.postMessage({ type: 'youtubeReady' }, '*');
            } catch(e) {}
          },
          onError: (e) => console.error('[player.html] Erro:', e.data)
        }
      });
    }

    // Escuta comandos do parent
    window.addEventListener('message', (event) => {
      console.log('[player.html] Mensagem recebida:', event.data);
      if (!event.data || !event.data.command) return;

      if (!ready || !ytPlayer) {
        window.parent.postMessage({ type: 'commandResult', success: false, error: 'not_ready' }, '*');
        return;
      }

      const { command, value } = event.data;
      let success = false;

      switch (command) {
        case 'togglePlayPause':
          if (ytPlayer.getPlayerState() === 1) ytPlayer.pauseVideo();
          else ytPlayer.playVideo();
          success = true;
          break;
        case 'forward':
          ytPlayer.seekTo(Math.min(ytPlayer.getCurrentTime() + (value || 10), ytPlayer.getDuration()), true);
          success = true;
          break;
        case 'rewind':
          ytPlayer.seekTo(Math.max(ytPlayer.getCurrentTime() - (value || 10), 0), true);
          success = true;
          break;
        default:
          break;
      }

      window.parent.postMessage({ type: 'commandResult', success, command }, '*');
    });
  </script>
</body>
</html>
