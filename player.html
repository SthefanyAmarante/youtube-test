<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player YouTube</title>
  <style>
    body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
    #player { width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="player"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let ytPlayer;
    let ready = false;

    function onYouTubeIframeAPIReady() {
      const params = new URLSearchParams(location.search);
      const videoId = params.get('id') || 'jNQXAC9IVRw';

      ytPlayer = new YT.Player('player', {
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          mute: 1,
          controls: 1,
          modestbranding: 1,
          rel: 0,
          enablejsapi: 1,
          origin: 'https://www.youtube.com'
        },
        events: {
          onReady: () => {
            ready = true;
            console.log('[player.html] Player pronto');
            // Tenta notificar o parent (pode ser bloqueado)
            try {
              window.parent.postMessage({ type: 'youtubeReady' }, '*');
            } catch(e) {
              console.warn('postMessage bloqueado?', e);
            }
          },
          onError: (e) => console.error('[player.html] Erro:', e.data)
        }
      });
    }

    // Função para executar comando quando pronto
    function executeCommand(cmd) {
      if (!ready || !ytPlayer) {
        console.warn('[player.html] Player ainda não pronto, ignorando comando', cmd.command);
        return false;
      }
      const { command, value } = cmd;
      switch (command) {
        case 'togglePlayPause':
          ytPlayer.getPlayerState() === 1 ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
          break;
        case 'forward':
          ytPlayer.seekTo(Math.min(ytPlayer.getCurrentTime() + (value || 10), ytPlayer.getDuration()), true);
          break;
        case 'rewind':
          ytPlayer.seekTo(Math.max(ytPlayer.getCurrentTime() - (value || 10), 0), true);
          break;
        default: break;
      }
      return true;
    }

    // Escuta comandos do parent
    window.addEventListener('message', (event) => {
      // Aceitamos mensagens de qualquer origem (file:// inclusive)
      if (event.data && event.data.command) {
        executeCommand(event.data);
      }
    });

    // Notifica pronto via postMessage a cada 300ms até obter um ACK (opcional)
    // Mas vamos manter simples e confiar que o parent enviará comandos após algum tempo.
  </script>
</body>
</html>
