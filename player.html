<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player YouTube</title>
  <style>
    body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
    #player { width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let ytPlayer;
    let ready = false;

    function onYouTubeIframeAPIReady() {
      const params = new URLSearchParams(location.search);
      const videoId = params.get('id') || 'jNQXAC9IVRw';

      ytPlayer = new YT.Player('player', {
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          mute: 1,
          controls: 1,
          modestbranding: 1,
          rel: 0,
          enablejsapi: 1,
          origin: 'https://www.youtube.com'
        },
        events: {
          onReady: () => {
            ready = true;
            console.log('[player.html] Player pronto');
            try {
              window.parent.postMessage({ type: 'youtubeReady' }, '*');
            } catch(e) {}
          },
          onError: (e) => console.error('[player.html] Erro:', e.data)
        }
      });
    }

    // Escuta comandos e envia resposta de confirmação
    window.addEventListener('message', (event) => {
      console.log('[player.html] Mensagem recebida:', event.data);
      if (!event.data || !event.data.command) return;

      let success = false;
      const { command, value } = event.data;

      if (!ready || !ytPlayer) {
        // player ainda não pronto, não faz nada mas responde
        window.parent.postMessage({ type: 'commandResult', success: false, error: 'not_ready' }, '*');
        return;
      }

      switch (command) {
        case 'togglePlayPause':
          if (ytPlayer.getPlayerState() === 1) ytPlayer.pauseVideo();
          else ytPlayer.playVideo();
          success = true;
          break;
        case 'forward':
          ytPlayer.seekTo(Math.min(ytPlayer.getCurrentTime() + (value || 10), ytPlayer.getDuration()), true);
          success = true;
          break;
        case 'rewind':
          ytPlayer.seekTo(Math.max(ytPlayer.getCurrentTime() - (value || 10), 0), true);
          success = true;
          break;
      }

      window.parent.postMessage({ type: 'commandResult', success, command }, '*');
    });
  </script>
</body>
</html>
